services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: voicerada
      POSTGRES_USER: voicerada
      POSTGRES_PASSWORD: voicerada
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicerada -d voicerada"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://voicerada:voicerada@postgres:5432/voicerada}
      VOICE_RADAR_SECRET: ${VOICE_RADAR_SECRET:-local-development-secret}
      DEMO_RESPONDER_EMAIL: ${DEMO_RESPONDER_EMAIL:-responder@voicerada.local}
      DEMO_RESPONDER_PASSWORD: ${DEMO_RESPONDER_PASSWORD:-change-me}
    ports: ["${BACKEND_PORT:-8001}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 8
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8001}
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:${BACKEND_PORT:-8001}"
    ports: ["${FRONTEND_PORT:-3001}:3000"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  postgres_data:
