services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: voicerada
      POSTGRES_USER: voicerada
      POSTGRES_PASSWORD: voicerada
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicerada -d voicerada"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://voicerada:voicerada@postgres:5432/voicerada}
      VOICE_RADAR_SECRET: ${VOICE_RADAR_SECRET:-local-development-secret}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-responder@voicerada.local}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      VELOCITY_WINDOW_MINUTES: ${VELOCITY_WINDOW_MINUTES:-60}
      VELOCITY_REPORT_THRESHOLD: ${VELOCITY_REPORT_THRESHOLD:-3}
      CLUSTER_RADIUS_METERS: ${CLUSTER_RADIUS_METERS:-1500}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_STT_MODEL: ${GROQ_STT_MODEL:-whisper-large-v3-turbo}
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-20}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_WHATSAPP_WEBHOOK_URL: ${TWILIO_WHATSAPP_WEBHOOK_URL:-}
      TWILIO_VOICE_WEBHOOK_URL: ${TWILIO_VOICE_WEBHOOK_URL:-}
    ports: ["${BACKEND_PORT:-8001}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 8
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8001}
        NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN:-}
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:${BACKEND_PORT:-8001}"
      NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN:-}
    ports: ["${FRONTEND_PORT:-3001}:3000"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  postgres_data:
